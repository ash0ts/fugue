name: W&B MCP local reference study

on:
  workflow_dispatch:
    inputs:
      run_cells:
        description: Run the exact protected eight-cell comparison
        required: true
        type: boolean
        default: false
      candidate_sha:
        description: Exact candidate SHA observed in the reviewed preparation receipt
        required: false
        type: string
      preview_digest:
        description: Exact digest from the reviewed pure preview
        required: false
        type: string
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  no-spend-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: wandb-mcp-release-qualification
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          python-version: "3.13"
      - name: Build and install the exact Fugue wheel
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/fugue-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip wheel --no-deps --wheel-dir "$wheelhouse" .
          mapfile -t wheels < <(find "$wheelhouse" -maxdepth 1 -type f -name 'fugue-*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          python -m pip install "${wheel}[local-runner,mcp,weave]"
          python -I -c 'import fugue, os; from pathlib import Path; source = Path(os.environ["GITHUB_WORKSPACE"]).resolve(); installed = Path(fugue.__file__).resolve(); assert not installed.is_relative_to(source), (source, installed)'
          printf 'FUGUE_WHEEL_PATH=%s\n' "$wheel" >> "$GITHUB_ENV"
      - name: Resolve and freeze staging without Agent spend
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p .fugue/reference-studies/wandb-mcp
          sha256sum "$FUGUE_WHEEL_PATH" \
            > .fugue/reference-studies/wandb-mcp/fugue-wheel.sha256
          fugue doctor --workspace "$PWD" --require local-runner --json \
            > .fugue/reference-studies/wandb-mcp/doctor.json
          env -u OPENAI_API_KEY fugue mcp prepare-wandb-release \
            --repo-root "$PWD" \
            --platform linux/amd64 \
            > .fugue/reference-studies/wandb-mcp/preparation.cli.json
      - name: Check and preview the exact immutable comparison
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          set -euo pipefail
          COMPARISON=$(python -c 'import json; print(json.load(open(".fugue/reference-studies/wandb-mcp/preparation.cli.json"))["comparison_path"])')
          set +e
          env -u OPENAI_API_KEY fugue check "$COMPARISON" --json \
            > .fugue/reference-studies/wandb-mcp/check.json
          CHECK_STATUS=$?
          set -e
          test "$CHECK_STATUS" -eq 0 -o "$CHECK_STATUS" -eq 2
          env -u OPENAI_API_KEY fugue compare "$COMPARISON" --preview --json \
            > .fugue/reference-studies/wandb-mcp/preview.json
      - name: Upload the exact public no-spend preparation and preview
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wandb-mcp-reference-preview
          path: |
            .fugue/reference-studies/wandb-mcp/
            !.fugue/reference-studies/wandb-mcp/**/private-labels.jsonl
            !.fugue/reference-studies/wandb-mcp/**/.env
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Write a bounded no-spend failure receipt
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fugue/ci
          python -c 'import json, os, pathlib; pathlib.Path(".fugue/ci/wandb-mcp-preview-failure.json").write_text(json.dumps({"schema_version": 1, "status": "failed", "stage": "no-spend-preview", "workflow": os.environ.get("GITHUB_WORKFLOW", ""), "run_id": os.environ.get("GITHUB_RUN_ID", "")}, sort_keys=True) + "\n")'
      - name: Upload only the bounded no-spend failure receipt
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wandb-mcp-reference-preview-failure
          path: .fugue/ci/wandb-mcp-preview-failure.json
          if-no-files-found: error
          retention-days: 14

  protected-execute:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_cells }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: wandb-mcp-release-qualification
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          python-version: "3.13"
      - name: Require reviewed immutable identities
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_PREVIEW_DIGEST: ${{ inputs.preview_digest }}
        run: |
          test -n "$EXPECTED_CANDIDATE_SHA"
          test -n "$EXPECTED_PREVIEW_DIGEST"
      - name: Build and install the exact Fugue wheel
        shell: bash
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/fugue-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip wheel --no-deps --wheel-dir "$wheelhouse" .
          mapfile -t wheels < <(find "$wheelhouse" -maxdepth 1 -type f -name 'fugue-*.whl' -print)
          test "${#wheels[@]}" -eq 1
          wheel="${wheels[0]}"
          python -m pip install "${wheel}[local-runner,mcp,weave]"
          python -I -c 'import fugue, os; from pathlib import Path; source = Path(os.environ["GITHUB_WORKSPACE"]).resolve(); installed = Path(fugue.__file__).resolve(); assert not installed.is_relative_to(source), (source, installed)'
          printf 'FUGUE_WHEEL_PATH=%s\n' "$wheel" >> "$GITHUB_ENV"
      - name: Reprepare and reproduce the reviewed preview
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_PREVIEW_DIGEST: ${{ inputs.preview_digest }}
        run: |
          set -euo pipefail
          mkdir -p .fugue/reference-studies/wandb-mcp
          sha256sum "$FUGUE_WHEEL_PATH" \
            > .fugue/reference-studies/wandb-mcp/fugue-wheel.sha256
          fugue doctor --workspace "$PWD" --require local-runner \
            --model anthropic/claude-sonnet-5 --json \
            > .fugue/reference-studies/wandb-mcp/doctor.json
          env -u OPENAI_API_KEY fugue mcp prepare-wandb-release \
            --repo-root "$PWD" \
            --platform linux/amd64 \
            > .fugue/reference-studies/wandb-mcp/preparation.cli.json
          COMPARISON=$(python -c 'import json; print(json.load(open(".fugue/reference-studies/wandb-mcp/preparation.cli.json"))["comparison_path"])')
          OBSERVED_CANDIDATE=$(python -c 'import json; print(json.load(open(".fugue/reference-studies/wandb-mcp/preparation.cli.json"))["candidate_sha"])')
          test "$OBSERVED_CANDIDATE" = "$EXPECTED_CANDIDATE_SHA"
          env -u OPENAI_API_KEY fugue check "$COMPARISON" --json \
            > .fugue/reference-studies/wandb-mcp/check.json
          env -u OPENAI_API_KEY fugue compare "$COMPARISON" --preview --json \
            > .fugue/reference-studies/wandb-mcp/preview.json
          OBSERVED_PREVIEW=$(python -c 'import json; print(json.load(open(".fugue/reference-studies/wandb-mcp/preview.json"))["preview_digest"])')
          test "$OBSERVED_PREVIEW" = "$EXPECTED_PREVIEW_DIGEST"
          fugue approve "$OBSERVED_PREVIEW" \
            --max-cells 8 \
            --max-usd 10 \
            --approved-by "github:${GITHUB_ACTOR}" \
            --repo-root "$PWD" \
            > .fugue/reference-studies/wandb-mcp/approval.json
      - name: Run only the exact protected comparison
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          set -euo pipefail
          COMPARISON=$(python -c 'import json; print(json.load(open(".fugue/reference-studies/wandb-mcp/preparation.cli.json"))["comparison_path"])')
          APPROVAL=$(python -c 'import json; print(json.load(open(".fugue/reference-studies/wandb-mcp/approval.json"))["approval_digest"])')
          env -u OPENAI_API_KEY fugue compare "$COMPARISON" \
            --run --approval "$APPROVAL"
          env -u OPENAI_API_KEY fugue result latest --repo-root "$PWD" --json \
            > .fugue/reference-studies/wandb-mcp/result.json
      - name: Upload canonical local evidence and result
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wandb-mcp-reference-result
          path: |
            .fugue/
            !.fugue/private/**
            !.fugue/reference-studies/wandb-mcp/**/private-labels.jsonl
            !.fugue/reference-studies/wandb-mcp/**/.env
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Write a bounded protected-execution failure receipt
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fugue/ci
          python -c 'import json, os, pathlib; pathlib.Path(".fugue/ci/wandb-mcp-execution-failure.json").write_text(json.dumps({"schema_version": 1, "status": "failed", "stage": "protected-execute", "workflow": os.environ.get("GITHUB_WORKFLOW", ""), "run_id": os.environ.get("GITHUB_RUN_ID", "")}, sort_keys=True) + "\n")'
      - name: Upload only the bounded protected-execution failure receipt
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wandb-mcp-reference-failure
          path: .fugue/ci/wandb-mcp-execution-failure.json
          if-no-files-found: error
          retention-days: 14
