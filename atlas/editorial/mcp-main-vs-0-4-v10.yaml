findings:
  - Evidence integrity passed and bounded inventory plus Evaluation reconciliation improved, but the candidate still regressed behaviorally and the release stayed on HOLD.
  - Candidate full deterministic passes were 1/8; aligned pairs were zero improved, one regressed, and seven unchanged; seven candidate attempts retained critical failures.
caveats:
  - The exact V3 task-row artifact was unavailable from the local Research store, so this page publishes the reviewed aggregate and exact digest without reconstructing task rows.
  - The judge is advisory, infrastructure release gates are separate, and this study cannot attribute the whole-release result to one 0.4 feature.
