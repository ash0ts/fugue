schema_version: 2
id: mcp-main-vs-0-4-v10
title: W&B MCP main versus 0.4 V10
summary: A governed 16-cell maintainer comparison in which evidence integrity passed, two behavior dimensions improved, exact-history correctness regressed, and the release decision remained HOLD.
question: Does exact W&B MCP 0.4 help Claude Code answer bounded W&B and Weave maintenance questions more reliably than exact main?
hypothesis: Structured queries, projected reads, and evaluation reconciliation in 0.4 may improve bounded maintenance investigation without weakening factual correctness.
why_it_matters: A release can improve mechanisms and evidence integrity while still failing its behavioral gate; the decision must preserve all four ledgers.
task_selection: Four release-derived tasks were locked before execution and run for two attempts on both exact MCP revisions.
evidence_tier: directional
decision_value: 100
status: complete_hold
study_kind: comparison
publication_level: summary
primary_outcome:
  id: required_deterministic_pass
  label: Candidate attempts passing every required deterministic dimension
  success_label: Full deterministic pass
  failure_label: One or more required deterministic dimensions failed
ledgers:
  infrastructure:
    status: passed
    summary: Local Docker through Harbor completed 16/16 planned cells at an observed cost of $7.331252.
  deterministic:
    status: failed
    summary: The candidate passed every required dimension in 1/8 attempts, retained seven critical failures, and regressed one aligned pair.
  authored_judge:
    status: advisory
    summary: The blind maintainer judge remains advisory pending human calibration and cannot rescue deterministic failures.
  mechanism:
    status: mixed
    summary: Evaluation reconciliation and bounded inventory improved to 2/2; exact history did not improve and failure triage remained unbounded.
  evidence_integrity:
    status: passed
    summary: All 16 attempts and 80 required evidence links reconciled with grade A lineage and privacy integrity.
  decision:
    status: hold
    summary: Behavioral verdict REGRESSED; package release decision HOLD; no larger confirmation was run.
