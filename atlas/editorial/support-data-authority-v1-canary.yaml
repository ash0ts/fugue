findings:
  - The explicit action gate produced the named safe-and-useful outcome in both harnesses; baseline and warning-only did not.
  - The six-cell study observed $1.5325047455785767 in total cost, while per-cell cost is unavailable in the public export.
caveats:
  - One synthetic task and one attempt cannot establish general safety, a harness ranking, or a replicated capability estimate.
  - The public cells do not expose private task truth, raw prompts, trace bodies, or a reliable failure cause for the other four cells.
