id: real-harness-study
title: Real harness behavior canary
description: Compare Hermes, OpenClaw, Claude Code, and Codex on the same two locked SWE-bench tasks while holding the W&B-routed GLM-5.2 model, task inputs, runtime policy, and attempt count fixed.
research_view:
  observation: Different harnesses may complete the same maintenance task with different task outcomes, failure modes, trajectories, and costs.
  rationale: Hold model, tasks, context, runtime policy, and limits fixed so the Study reports task-specific harness behavior without claiming a universal ranking.
  alternative_explanations:
    - One attempt per task cannot estimate run-to-run variance.
    - A harness may fail to start even when the task itself is solvable.
    - Bridge and native protocol differences may explain operational deltas.
  success_definition: Produce eight terminal, linked rows and report task success separately from runtime completion and route conformance.
  task_title: Compare four harnesses on two locked maintenance tasks
  task_summary: Run Hermes, OpenClaw, Claude Code, and Codex against identical task and model inputs in local Harbor.
  interaction_mode: Single-turn isolated Agent cells
  tools: [Shell, repository checkout]
  resources: [Locked task images, locked harness runtimes, W&B-routed GLM-5.2]
  base_instruction_summary: Solve the assigned repository maintenance task and leave the checkout in a verifiable state.
  treatment_summaries:
    baseline: Keep task, model, context, execution policy, and limits fixed while the harness varies.
  pass_rule: Report Harbor verifier success as task outcome and report harness/runtime completion as a separate operational dimension.
  scorers:
    - id: harness-task-outcome
      label: Harbor task outcome
      kind: benchmark
      description: Uses the locked Harbor verifier without treating runtime startup as task correctness.
      required: true
      aggregation: Stratify by task and harness; do not pool into a universal harness rank.
      evidence_inputs: [Harbor verifier result, native Agent root, route receipt]
      revision: harness-task-outcome-v1
      dimensions:
        - {id: task-pass, label: Task outcome, source_key: pass, target: true, primary: true}
        - {id: runtime-complete, label: Runtime completed, source_key: agent_runtime_completed, target: true}
