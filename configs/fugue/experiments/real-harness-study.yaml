    systems: [none]
    variants: [baseline]
    scorers:
      - {type: builtin, id: harbor-outcome}
presets:
  canary:
    workloads: [canary]
    systems: [none]
    harnesses: [hermes, openclaw, claude-code, codex]
    environment: {type: docker}
    n_attempts: 1
    n_tasks: 2
    n_concurrent: 1
    scheduling_seed: real-harness-canary-v1
variants:
