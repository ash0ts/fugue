id: real-harness-study
title: Real harness behavior canary
description: Compare Hermes, OpenClaw, Claude Code, and Codex on the same two locked SWE-bench tasks while holding the W&B-routed GLM-5.2 model, task inputs, runtime policy, and attempt count fixed.
model: wandb/zai-org/GLM-5.2
run_name: real-harness-study
evidence_project: wandb/fugue-harness-experiments-v1
evidence_destination:
  entity: wandb
  project: fugue-harness-experiments-v1
  api_base_url: https://api.wandb.ai
  trace_base_url: https://trace.wandb.ai
  app_base_url: https://wandb.ai
default_preset: canary
tags: [agent-eval, harness-comparison, real-study-lane-v1]
harnesses: [hermes, openclaw, claude-code, codex]
