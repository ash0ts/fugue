    label: Fixed task and model
    context: {system_id: none, delivery: portable}
n_attempts: 1
n_concurrent: 1
n_tasks: 2
jobs_dir: .fugue/runtime/jobs/real-harness-study
trace_content: full
environment: {type: docker}
