name: Agent change comparison

on:
  workflow_call:
    inputs:
      comparison:
        description: Repository-relative comparison YAML
        required: true
        type: string
      run:
        description: Run after protected-environment approval
        required: false
        default: false
        type: boolean
      max-usd:
        description: Maximum approved observed and reserved cost
        required: false
        default: 40
        type: number
      max-cells:
        description: Maximum approved attempts
        required: false
        default: 32
        type: number
    secrets:
      FUGUE_WANDB_INFERENCE_API_KEY:
        required: false
      FUGUE_WEAVE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPARISON_PATH: ${{ inputs.comparison }}
    outputs:
      digest: ${{ steps.preview.outputs.digest }}
      comparison-id: ${{ steps.preview.outputs.comparison-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --extra research-worker
      - name: Check evaluation readiness
        run: uv run fugue check "$COMPARISON_PATH" --json > readiness.json
      - name: Compile exact preview
        id: preview
        run: |
          uv run fugue compare "$COMPARISON_PATH" --preview --json > preview.json
          digest="$(jq -r .preview_digest preview.json)"
          comparison_id="$(jq -r .comparison.id preview.json)"
          jq -e '.preview_digest | strings | test("^[0-9a-f]{64}$")' preview.json
          jq -e '.comparison.id | strings | test("^[A-Za-z0-9][A-Za-z0-9_.-]*$")' preview.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "comparison-id=$comparison_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fugue-comparison-preview
          path: |
            readiness.json
            preview.json

  run:
    if: inputs.run
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: fugue-paid-comparisons
    env:
      APPROVED_BY: github-environment:${{ github.actor }}
      COMPARISON_ID: ${{ needs.preview.outputs.comparison-id }}
      COMPARISON_PATH: ${{ inputs.comparison }}
      FUGUE_WANDB_INFERENCE_API_KEY: ${{ secrets.FUGUE_WANDB_INFERENCE_API_KEY }}
      FUGUE_WEAVE_API_KEY: ${{ secrets.FUGUE_WEAVE_API_KEY }}
      MAX_CELLS: ${{ inputs.max-cells }}
      MAX_USD: ${{ inputs.max-usd }}
      PREVIEW_DIGEST: ${{ needs.preview.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.3.2
      - run: uv sync --frozen --extra research-worker
      - name: Verify the accepted preview did not drift
        run: |
          uv run fugue compare "$COMPARISON_PATH" --preview --json > preview.json
          test "$(jq -r .preview_digest preview.json)" = "$PREVIEW_DIGEST"
          test "$(jq -r .comparison.id preview.json)" = "$COMPARISON_ID"
      - name: Bind protected approval to the exact preview
        id: approve
        run: |
          uv run fugue approve "$PREVIEW_DIGEST" \
            --max-usd "$MAX_USD" \
            --max-cells "$MAX_CELLS" \
            --approved-by "$APPROVED_BY" > approval.json
          approval_digest="$(jq -r .approval_digest approval.json)"
          jq -e '.approval_digest | strings | test("^[0-9a-f]{64}$")' approval.json
          echo "digest=$approval_digest" >> "$GITHUB_OUTPUT"
      - name: Run aligned attempts
        env:
          APPROVAL_DIGEST: ${{ steps.approve.outputs.digest }}
        run: >-
          uv run fugue compare "$COMPARISON_PATH"
          --run --approval "$APPROVAL_DIGEST"
      - name: Export result
        if: always()
        run: uv run fugue result "$COMPARISON_ID" --json > result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fugue-comparison-result
          path: |
            approval.json
            preview.json
            result.json
            .fugue/results/comparisons/**
