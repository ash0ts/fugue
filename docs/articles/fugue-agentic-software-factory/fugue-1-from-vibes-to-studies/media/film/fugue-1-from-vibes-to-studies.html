      else if(v.type==="series_map")drawSeriesMap(v,p);
    }
    function drawScene(scene,index,local,alpha){
      withAlpha(alpha,()=>{
        text(STORY.part,54,53,TYPE.compact,C.muted,"mono",600);
        text(STORY.status,1226,53,TYPE.compact,STORY.status.includes("NO RESULT")?C.amber:C.blue,"mono",600,"right");
        pill(`PLACED AFTER: ${STORY.placement.after_label}`,54,87,C.slate,C.white);
        const evidence=KIND[scene.kind];pill(evidence.label,1226,87,evidence.accent,C.white,"right");
        text(scene.eyebrow,54,130,TYPE.compact,evidence.accent,"mono",600);
        const headlineSize=scene.headline.length>62?38:scene.headline.length>48?42:46;
        wrap(scene.headline,54,183,1120,45,headlineSize,C.ink,"serif",400,2);
        scene.support.forEach((item,sIndex)=>wrap(
          item,54,260+sIndex*31,1120,29,TYPE.supporting,
          sIndex?C.muted:C.ink,"sans",sIndex?400:600,1
        ));
        drawVisual(scene,ease(local));
        text(`${String(index+1).padStart(2,"0")} / ${String(STORY.scenes.length).padStart(2,"0")}`,54,630,TYPE.compact,C.muted,"mono",600);
        text(`${formatTime(scene.start)}–${formatTime(scene.end)}`,190,630,TYPE.compact,C.muted,"mono",600);
      });
    }
    function render(time){
      const t=clamp(Number(time)||0,0,FILM.duration-.0001);background();
      const index=Math.max(0,STORY.scenes.findIndex(scene=>t>=scene.start&&t<scene.end));
      const scene=STORY.scenes[index],localSeconds=t-scene.start,local=localSeconds/scene.duration;
      if(index>0&&localSeconds<FILM.transitionSeconds){
        const blend=ease(localSeconds/FILM.transitionSeconds);
        const previous=STORY.scenes[index-1];
        drawScene(previous,index-1,1,1-blend);
        drawScene(scene,index,Math.max(local,.08),blend);
      }else{
        drawScene(scene,index,local,1);
      }
      rect(54,682,1172,4,C.line);rect(54,682,1172*(t/FILM.duration),4,C.blue);
      clock.value=`${formatTime(t)} / ${formatTime(FILM.duration)}`;if(!renderMode)scrub.value=String(t);
    }
    function currentTime(now=performance.now()){return playing?(anchorFilm+(now-anchorTime)/1000)%FILM.duration:manualTime}
    function loop(now){if(!renderMode)render(currentTime(now));requestAnimationFrame(loop)}
    toggle.addEventListener("click",()=>{if(playing){manualTime=currentTime();playing=false;toggle.textContent="Play";toggle.setAttribute("aria-label","Play animation")}else{anchorFilm=manualTime;anchorTime=performance.now();playing=true;toggle.textContent="Pause";toggle.setAttribute("aria-label","Pause animation")}});
    scrub.addEventListener("input",()=>{manualTime=Number(scrub.value);anchorFilm=manualTime;anchorTime=performance.now();render(manualTime)});
    window.setAnimationTime=seconds=>{renderMode=true;playing=false;manualTime=Number(seconds)||0;render(manualTime);return true};
    window.releaseAnimation=()=>{renderMode=false;anchorFilm=manualTime;anchorTime=performance.now();playing=true;toggle.textContent="Pause";toggle.setAttribute("aria-label","Pause animation");return true};
    Promise.all([document.fonts.load('400 46px "Source Serif Pro"'),document.fonts.load('600 24px "Source Sans 3"'),document.fonts.load('600 18px "IBM Plex Mono"')]).then(()=>{const requestedValue=new URLSearchParams(location.hash.replace(/^#/,"")).get("t");const requested=requestedValue===null?Number.NaN:Number(requestedValue);const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;if(reduced||Number.isFinite(requested)){playing=false;manualTime=Number.isFinite(requested)?clamp(requested,0,FILM.duration-.01):FILM.reducedMotionTime;toggle.textContent="Play";toggle.setAttribute("aria-label","Play animation")}render(playing?0:manualTime);window.__animationReady=true;requestAnimationFrame(loop)});
  </script>
</body>
