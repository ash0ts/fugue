# V2 is a fresh measurement-development Study. It preserves the exact V1
# tasks, private truth, scorer, Skill revisions, model, harness, and scheduling
# design, while binding substantive scorer mutation qualification and a product
# contract that separates upstream parser acceptance from task usefulness.
# Its result is descriptive for this authored benchmark and is not eligible for
# a population or conference claim.
schema_version: 3
id: anthropic-skill-creator-confirmatory-v2
question: For descriptive measurement development on this exact authored benchmark—not a population or conference claim—what task-specific compatibility, preservation, validation-boundary, and name/help signal does Anthropic Skill Creator revision 1ed29a03 produce relative to a5bcdd7e?
taskset:
  tasks: confirmatory-tasks.jsonl
  private_labels: confirmatory-private-labels.jsonl
baseline:
  label: Anthropic Skill Creator before compatibility at a5bcdd7e
  skills: [anthropic-skill-creator-before-compatibility]
candidate:
  label: Anthropic Skill Creator with compatibility at 1ed29a03
  skills: [anthropic-skill-creator-compatibility]
changed: [skills]
evaluators:
  - id: skill-creator-confirmatory
    type: deterministic
    required: true
    scorer: confirmatory_scorer.py
    runtime: python312-sandbox-v1
    dimensions:
      - artifact_validity
      - frontmatter_semantics
      - compatibility_selection
      - name_help_consistency
      - behavior_preservation
      - packaging
      - instruction_quality
      - dependency_secret_safety
      - assigned_script_use
    dimension_roles:
      artifact_validity: safety_gate
      frontmatter_semantics: outcome
      compatibility_selection: outcome
      name_help_consistency: outcome
      behavior_preservation: safety_gate
      packaging: safety_gate
      instruction_quality: outcome
      dependency_secret_safety: safety_gate
      assigned_script_use: mechanism
  - id: community-usefulness
    type: llm_judge
    required: false
    profile: anthropic/claude-sonnet-5
    calibration: ../community-skill-upgrades/judge-calibration-v2.json
    rubric: >-
      Judge the artifact type requested (plan, implemented change, or
      recommendation) for its usefulness on the stated repository task. Score
      only whether it is actionable, grounds claims in the inspected repository,
      is reviewable by a maintainer, and calibrates risk and uncertainty to the
      available evidence. The inspected_paths and changed_paths values are
      audited activity, not proof of repository contents or task correctness.
      Their status fields state whether collection was available. An available
      empty changed_paths list means the collector observed no edits and is
      expected for plans and recommendations; an unavailable status is not an
      empty receipt. Judge the requested artifact modality; do not require
      diffs, line numbers, file bodies, test output, or completed implementation
      when the task requests a plan or recommendation. Credit repository
      grounding when concrete components, contracts, sequencing, verification,
      and rollback are internally consistent with the available path activity.
      Set missing_evidence true only when evidence materially required to assess
      actionability, grounding, reviewability, or risk is absent, not because
      deterministic evidence is out of scope. Do not infer correctness from
      fluency, treatment identity, repository popularity, or Skill assignment.
      For this acceptable-versus-defective calibration, adequate is the minimum
      acceptable qualitative label and its limitations must remain visible;
      weak and unusable are defective, while strong and exceptional exceed the
      minimum. Deterministic scorers own build, test, schema, security, scope,
      and task-correctness gates. A qualitative label cannot override a
      deterministic critical failure.
    dimensions:
      - useful_actionability
      - repository_grounding
      - reviewability
      - risk_calibration
    dimension_roles:
      useful_actionability: outcome
      repository_grounding: outcome
      reviewability: outcome
      risk_calibration: outcome
    evidence: [inspected_paths, changed_paths]
    reserve_cost_usd: 0.10
