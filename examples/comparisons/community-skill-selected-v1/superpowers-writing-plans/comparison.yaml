     calibration_rubric: ../judge/rubric.json, calibration_modality: implementation-plan,
     calibration_required_for_execution: true,
     rubric: "Assess actionability, repository grounding, reviewability, and risk calibration using only public task/output/evidence; never override deterministic gates.",
