schema_version: 3
id: anthropic-skill-creator-measurement-pilot-v1
question: Does exact Anthropic Skill Creator revision 1ed29a03 improve public development-task outcomes relative to a5bcdd7e under fixed conditions?
taskset:
  tasks: tasks.jsonl
  private_labels: ../../../../.fugue/private/community-skill-selected-v1/anthropic-skill-creator/private-labels.jsonl
baseline:
  label: Anthropic Skill Creator at a5bcdd7e
  skills: [anthropic-skill-creator-before-compatibility]
  agent_kwargs: &bounded_agent
    max_turns: 48
    max_budget_usd: "1.80"
    disallowed_tools: Agent
candidate:
