    dimensions:
      - artifact_validity
      - frontmatter_semantics
      - compatibility_selection
      - name_help_consistency
      - instruction_quality
      - behavior_preservation
      - dependency_secret_safety
    dimension_roles:
      artifact_validity: safety_gate
      frontmatter_semantics: outcome
      compatibility_selection: outcome
      name_help_consistency: outcome
      instruction_quality: outcome
      behavior_preservation: safety_gate
      dependency_secret_safety: safety_gate
  - {id: skill-package-usefulness, type: llm_judge, required: false, profile: anthropic/claude-sonnet-5,
     calibration: ../../../../.fugue/private/community-skill-selected-v1/generation-receipt.json,
     calibration_rubric: ../judge/rubric.json, calibration_modality: skill-package,
     rubric: "Assess instruction usefulness, compatibility guidance, boundedness, and maintainability using only public task/output/evidence; never override deterministic gates.",
     dimensions: [instruction_usefulness, compatibility_guidance, boundedness, maintainability], dimension_roles: {instruction_usefulness: outcome, compatibility_guidance: outcome, boundedness: outcome, maintainability: outcome},
     evidence: [artifact_paths, inspected_paths, changed_paths], reserve_cost_usd: 0.1}
execution:
