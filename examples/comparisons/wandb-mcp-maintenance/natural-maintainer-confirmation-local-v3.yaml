schema_version: 3
id: mcp-main-vs-0-4-natural-maintainer-confirmation-v3
question: Is the exact provisional W&B MCP 0.4 fix PR #126 behavior repeatable across the full immutable natural-maintainer taskset relative to main?
taskset:
  tasks: natural-maintainer-confirmation-tasks.jsonl
  private_labels: natural-maintainer-confirmation-private.jsonl
baseline:
  label: W&B MCP main at 53b199a5
  integrations: [wandb-mcp-main]
candidate:
  label: W&B MCP provisional fix PR #126 head at 3dd4447e
  integrations: [wandb-mcp-0-4-staging]
changed: [integrations]
evaluators:
  - id: natural-maintainer
    type: deterministic
    required: true
    scorer: natural_maintainer_scorer.py
    runtime: python312-sandbox-v1
    dimensions:
      - answer_correct
      - locked_source_scope
      - bounded_evidence
      - evidence_honesty
      - release_mechanism_used
execution:
  source_evidence_project: wandb/fugue-mcp-release-source-v1
  source_evidence_destination:
    entity: wandb
    project: fugue-mcp-release-source-v1
    api_base_url: https://api.wandb.ai
    trace_base_url: https://trace.wandb.ai
    app_base_url: https://wandb.ai
  evidence_project: wandb/fugue-mcp-release-qualification-v1
  evidence_destination:
    entity: wandb
    project: fugue-mcp-release-qualification-v1
    api_base_url: https://api.wandb.ai
    trace_base_url: https://trace.wandb.ai
    app_base_url: https://wandb.ai
  evidence_lock: ../../../.fugue/qualification/mcp-release-source-v1/evidence.lock.json
  release_notes_lock: release-notes.lock.json
  mechanism_receipt: ../../../.fugue/qualification/mcp-release-mechanism-receipt.json
  infrastructure_receipt: ../../../.fugue/qualification/mcp-python-package-release-gates.json
  research_id: fugue-mcp-release-qualification-v1
  model: anthropic/claude-sonnet-5
  harnesses: [claude-code]
  attempts: 2
  concurrency: 1
  evidence_checkpoint_cells: 1
  max_cost_usd: 20
  reserve_per_attempt_usd: 1.25
  approval_required: true
  preparation_required: true
  trace_content: full
  environment: {type: docker}
decision_policy:
  release_target: wandb-mcp-server Python package 0.4
  candidate_sha: 3dd4447ef0054d4707aafc515e3f2ddfb11b17bd
  minimum_evidence_grade: A
  human_signoff_required: true
  gates:
    - id: sixteen-terminal-cells
      label: Sixteen unique terminal confirmation cells
      category: integrity
      source: matrix.rows
      operator: gte
      target: 16
      critical: true
    - id: candidate-passes-twice
      label: Candidate passes all four critical maintainer tasks twice
      category: task
      source: task.candidate_passed
      operator: gte
      target: 8
      critical: true
    - id: candidate-critical-dimensions
      label: Candidate has no critical outcome or safety failure
      category: task
      source: task.candidate_critical_failures
      operator: eq
      target: 0
      critical: true
    - id: aggregate-cost-regression
      label: Aggregate candidate cost regression is at most 25 percent
      category: efficiency
      source: efficiency.cost_regression_pct
      operator: lte
      target: 25
      critical: true
    - id: aggregate-latency-regression
      label: Aggregate candidate latency regression is at most 25 percent
      category: efficiency
      source: efficiency.latency_regression_pct
      operator: lte
      target: 25
      critical: true
    - id: aggregate-tool-regression
      label: Aggregate candidate tool-call regression is at most 25 percent
      category: efficiency
      source: efficiency.tool_calls_regression_pct
      operator: lte
      target: 25
      critical: true
    - id: per-task-cost-review
      label: No task exceeds 50 percent cost regression without review
      category: efficiency
      source: efficiency.max_task_cost_regression_pct
      operator: lte
      target: 50
      critical: true
    - id: final-staging-head
      label: Candidate is the reviewed final staging head
      category: infrastructure
      source: infrastructure.gate.final-staging-head
      operator: eq
      target: true
      critical: true
    - id: human-maintainer-actionability
      label: A human maintainer accepted the memos as actionable
      category: evidence
      source: infrastructure.gate.human-maintainer-actionability-review
      operator: eq
      target: true
      critical: true
    - id: fresh-wheel-python-3-11
      label: Fresh wheel passes on Python 3.11
      category: infrastructure
      source: infrastructure.gate.fresh-wheel-python-3-11
      operator: eq
      target: true
      critical: true
    - id: fresh-wheel-python-3-12
      label: Fresh wheel passes on Python 3.12
      category: infrastructure
      source: infrastructure.gate.fresh-wheel-python-3-12
      operator: eq
      target: true
      critical: true
    - id: wandb-latest
      label: Package passes against the latest supported W&B SDK
      category: infrastructure
      source: infrastructure.gate.wandb-latest
      operator: eq
      target: true
      critical: true
    - id: ci-dependency-source-security
      label: CI, dependency, and source-security gates pass
      category: infrastructure
      source: infrastructure.gate.ci-dependency-source-security
      operator: eq
      target: true
      critical: true
    - id: release-note-coverage
      label: Every locked 0.4 release-note behavior is classified once
      category: evidence
      source: infrastructure.gate.release-note-coverage
      operator: eq
      target: true
      critical: true
    - id: no-source-project-writes
      label: No experiment result writes entered the immutable source project
      category: integrity
      source: integrity.source_project_writes
      operator: eq
      target: 0
      critical: true
    - id: no-leaks
      label: No credentials or private labels leaked
      category: privacy
      source: privacy.leaks
      operator: eq
      target: 0
      critical: true
    - id: no-harbor-orphans
      label: No run-scoped Harbor resources remain
      category: infrastructure
      source: infrastructure.gate.no-harbor-orphans
      operator: eq
      target: true
      critical: true
