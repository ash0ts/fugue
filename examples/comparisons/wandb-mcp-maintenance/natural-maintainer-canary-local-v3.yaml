schema_version: 3
id: mcp-main-vs-0-4-natural-maintainer-canary-v3
question: Does the exact W&B MCP 0.4 staging head preserve or improve a maintainer's bounded investigation of an immutable source cohort relative to main?
taskset:
  tasks: natural-maintainer-canary-tasks.jsonl
  private_labels: natural-maintainer-canary-private.jsonl
baseline:
  label: W&B MCP main at 53b199a5
  integrations: [wandb-mcp-main]
candidate:
  label: W&B MCP staging at 29cc1b5b
  integrations: [wandb-mcp-0-4-staging]
changed: [integrations]
evaluators:
  - id: natural-maintainer
    type: deterministic
    required: true
    scorer: natural_maintainer_scorer.py
    runtime: python312-sandbox-v1
    dimensions:
      - answer_correct
      - actual_query_scope
      - reported_project_identity
      - bounded_evidence
      - evidence_honesty
      - release_mechanism_used
    dimension_roles:
      answer_correct: outcome
      actual_query_scope: safety_gate
      reported_project_identity: safety_gate
      bounded_evidence: safety_gate
      evidence_honesty: outcome
      release_mechanism_used: mechanism
  - id: maintainer-actionability
    type: llm_judge
    required: false
    profile: wandb/zai-org/GLM-5.2
    calibration: maintainer-actionability-judge-calibration.json
    rubric: >-
      Judge only whether the maintainer memo turns the response's stated
      evidence into a concrete maintain, advance, or block recommendation;
      traces that action to the stated evidence; proposes one bounded feasible
      next step with a success or stop condition; and calibrates uncertainty to
      the inspected cohort. Do not rescore factual correctness, tool mechanics,
      revision identity, verbosity, cost, or latency; the deterministic scorer
      owns those. Unsupported causal, completeness, or release-wide claims are
      critical failures.
    dimensions:
      - maintenance_actionability
      - evidence_to_action_traceability
      - bounded_next_step
      - uncertainty_calibration
    dimension_roles:
      maintenance_actionability: outcome
      evidence_to_action_traceability: outcome
      bounded_next_step: outcome
      uncertainty_calibration: outcome
    evidence: [tool_names]
    reserve_cost_usd: 0.10
execution:
  source_evidence_project: wandb/fugue-mcp-release-source-v2
  source_evidence_destination:
    entity: wandb
    project: fugue-mcp-release-source-v2
    api_base_url: https://api.wandb.ai
    trace_base_url: https://trace.wandb.ai
    app_base_url: https://wandb.ai
  evidence_project: wandb/fugue-mcp-release-qualification-v1
  evidence_destination:
    entity: wandb
    project: fugue-mcp-release-qualification-v1
    api_base_url: https://api.wandb.ai
    trace_base_url: https://trace.wandb.ai
    app_base_url: https://wandb.ai
  evidence_lock: ../../../.fugue/qualification/mcp-release-source-v2/evidence.lock.json
  source_conformance_receipt: ../../../.fugue/qualification/mcp-release-source-conformance.json
  release_notes_lock: release-notes.lock.json
  mechanism_receipt: ../../../.fugue/qualification/mcp-release-mechanism-receipt.json
  infrastructure_receipt: ../../../.fugue/qualification/mcp-python-package-release-gates.json
  research_id: fugue-mcp-release-qualification-v1
  model: anthropic/claude-sonnet-5
  harnesses: [claude-code]
  attempts: 2
  concurrency: 1
  evidence_checkpoint_cells: 1
  max_cost_usd: 11
  reserve_per_attempt_usd: 1.25
  approval_required: true
  preparation_required: true
  trace_content: full
  environment: {type: docker}
decision_policy:
  release_target: wandb-mcp-server Python package 0.4
  candidate_sha: 29cc1b5b5cf4061afa1faa712021fa1b68ad0bf7
  minimum_evidence_grade: A
  human_signoff_required: true
  gates:
    - id: eight-terminal-cells
      label: Eight unique terminal canary cells
      category: integrity
      source: matrix.terminal_rows
      operator: gte
      target: 8
      critical: true
    - id: candidate-passes-twice
      label: Candidate passes both critical maintainer tasks twice
      category: task
      source: task.candidate_passed
      operator: gte
      target: 4
      critical: true
    - id: candidate-critical-dimensions
      label: Candidate has no critical outcome or safety failure
      category: task
      source: task.candidate_critical_failures
      operator: eq
      target: 0
      critical: true
    - id: aggregate-cost-regression
      label: Aggregate candidate cost regression is at most 25 percent
      category: efficiency
      source: efficiency.cost_regression_pct
      operator: lte
      target: 25
      critical: true
    - id: aggregate-latency-regression
      label: Aggregate candidate latency regression is at most 25 percent
      category: efficiency
      source: efficiency.latency_regression_pct
      operator: lte
      target: 25
      critical: true
    - id: aggregate-tool-regression
      label: Aggregate candidate tool-call regression is at most 25 percent
      category: efficiency
      source: efficiency.tool_calls_regression_pct
      operator: lte
      target: 25
      critical: true
    - id: per-task-cost-review
      label: No task exceeds 50 percent cost regression without review
      category: efficiency
      source: efficiency.max_task_cost_regression_pct
      operator: lte
      target: 50
      critical: true
    - id: final-staging-head
      label: Candidate is the reviewed final staging head
      category: infrastructure
      source: infrastructure.gate.final-staging-head
      operator: eq
      target: true
      critical: true
    - id: fresh-wheel-python-3-11
      label: Fresh wheel passes on Python 3.11
      category: infrastructure
      source: infrastructure.gate.fresh-wheel-python-3-11
      operator: eq
      target: true
      critical: true
    - id: fresh-wheel-python-3-12
      label: Fresh wheel passes on Python 3.12
      category: infrastructure
      source: infrastructure.gate.fresh-wheel-python-3-12
      operator: eq
      target: true
      critical: true
    - id: wandb-latest
      label: Package passes against the latest supported W&B SDK
      category: infrastructure
      source: infrastructure.gate.wandb-latest
      operator: eq
      target: true
      critical: true
    - id: installed-wheel-stdio-protocol
      label: Installed wheel keeps STDIO reserved for MCP JSON-RPC
      category: infrastructure
      source: infrastructure.gate.installed-wheel-stdio-protocol
      operator: eq
      target: true
      critical: true
    - id: ci-dependency-source-security
      label: CI, dependency, and source-security gates pass
      category: infrastructure
      source: infrastructure.gate.ci-dependency-source-security
      operator: eq
      target: true
      critical: true
    - id: no-source-project-writes
      label: No experiment result writes entered the immutable source project
      category: integrity
      source: integrity.source_project_writes
      operator: eq
      target: 0
      critical: true
    - id: no-leaks
      label: No credentials or private labels leaked
      category: privacy
      source: privacy.leaks
      operator: eq
      target: 0
      critical: true
    - id: no-harbor-orphans
      label: No run-scoped Harbor resources remain
      category: infrastructure
      source: infrastructure.gate.no-harbor-orphans
      operator: eq
      target: true
      critical: true
