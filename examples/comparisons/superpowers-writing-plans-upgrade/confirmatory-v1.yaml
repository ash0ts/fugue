schema_version: 3
id: superpowers-writing-plans-confirmatory-v1
question: Across a preregistered development set and sixteen untouched holdout maintenance briefs, does the exact Superpowers writing-plans upgrade improve repository-grounded plans, cross-component consistency, and cohesive decomposition without a verification or safety regression?
taskset:
  tasks: tasks-conference-v1.jsonl
  private_labels: private-labels-conference-v1.jsonl
baseline:
  label: Superpowers writing-plans before contract additions at de4672b1
  skills: [superpowers-writing-plans-before-contracts]
candidate:
  label: Superpowers writing-plans with contract additions at 8e1262a3
  skills: [superpowers-writing-plans-contracts]
changed: [skills]
evaluators:
  - id: plan-quality-confirmatory
    type: deterministic
    required: true
    scorer: plan_quality_scorer_v2.py
    runtime: python312-sandbox-v1
    dimensions:
      - artifact_validity
      - global_constraint_fidelity
      - interface_graph_consistency
      - right_sized_decomposition
      - repository_grounding
      - verification_matrix
      - scope_secret_safety
    dimension_roles:
      artifact_validity: safety_gate
      global_constraint_fidelity: outcome
      interface_graph_consistency: outcome
      right_sized_decomposition: outcome
      repository_grounding: outcome
      verification_matrix: safety_gate
      scope_secret_safety: safety_gate
  - id: community-usefulness
    type: llm_judge
    required: false
    profile: anthropic/claude-sonnet-5
    calibration: ../community-skill-upgrades/judge-calibration.json
    rubric: >-
      Judge the submitted maintenance plan only for actionability, repository
      grounding, maintainer reviewability, and calibrated risk using the public
      plan and audited path activity. Do not infer plan correctness, safety,
      treatment identity, or Skill quality from fluency. Deterministic
      host-side verification owns those gates. The labels are unusable, weak,
      adequate, strong, and exceptional; adequate is the minimum
      qualitatively useful artifact. Set missing_evidence only when evidence
      necessary to judge usefulness is absent. This same-model judge is
      advisory until the separate two-reviewer calibration passes and cannot
      override a deterministic or privacy failure.
    dimensions:
      - useful_actionability
      - repository_grounding
      - reviewability
      - risk_calibration
    dimension_roles:
      useful_actionability: outcome
      repository_grounding: outcome
      reviewability: outcome
      risk_calibration: outcome
    evidence: [inspected_paths, changed_paths]
    reserve_cost_usd: 0.10
